<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Umsatzboard · Wolny</title>
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>

<!-- ── Login ─────────────────────────────────────────────────────────── -->
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-card">
    <div class="login-eyebrow">WOLNY FINANZBERATUNG</div>
    <h1>Umsatzboard</h1>
    <p class="login-sub">Bitte anmelden</p>
    <label>E-Mail<input type="email" id="email" autocomplete="username" required></label>
    <label>Passwort<input type="password" id="password" autocomplete="current-password" required></label>
    <button type="submit" id="loginBtn">Anmelden</button>
    <button type="button" id="forgotBtn" class="link-btn">Passwort vergessen?</button>
    <div id="loginError" class="login-error" hidden></div>
  </form>
</div>

<!-- ── Passwort zurücksetzen (Recovery-Link) ────────────────────────── -->
<div id="recovery" class="login" hidden>
  <form id="recoveryForm" class="login-card">
    <div class="login-eyebrow">WOLNY FINANZBERATUNG</div>
    <h1>Neues Passwort</h1>
    <p class="login-sub">Bitte neues Passwort setzen</p>
    <label>Neues Passwort<input type="password" id="newPass" autocomplete="new-password" minlength="6" required></label>
    <button type="submit">Speichern</button>
    <div id="recoveryError" class="login-error" hidden></div>
  </form>
</div>

<!-- ── App ───────────────────────────────────────────────────────────── -->
<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-eyebrow">WOLNY</div>
      <div class="brand-title">Umsatzboard</div>
    </div>
    <div id="roleSwitch" class="roleswitch" hidden></div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-foot">
      <a class="sidebar-tools" href="https://wolny-tools.vercel.app/" target="_blank" rel="noopener" title="Beratungstools-Portal öffnen">🧰 Beratungstools</a>
      <button id="importBtn" class="btn-ghost" title="Daten aus Excel-Datei importieren">⇪ Excel importieren</button>
      <input type="file" id="importFile" accept=".xlsx" hidden>
      <button id="exportBtn" class="btn-ghost" title="Alle Daten als Excel-Datei herunterladen">⇩ Excel Export</button>
      <div id="userLine" class="user-line"></div>
      <button id="changePwBtn" class="btn-ghost">Passwort ändern</button>
      <button id="logoutBtn" class="btn-ghost">Abmelden</button>
    </div>
  </aside>
  <main id="view" class="view"></main>
</div>

<datalist id="terminarten">
  <option value="S1"></option><option value="S2"></option><option value="S3"></option>
  <option value="Service"></option><option value="AEC"></option><option value="TzT"></option><option value="Recruiting"></option>
</datalist>
<datalist id="ablehnungsgruende">
  <option value="Kein Interesse"></option><option value="Kein Budget"></option><option value="Zeitpunkt"></option>
  <option value="Nicht erreichbar"></option><option value="Konkurrenz"></option><option value="Kein Bedarf"></option><option value="Vertagt"></option>
</datalist>

<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js?v=8"></script>
<script src="demo.js?v=8"></script>
<script src="app.js?v=8"></script>
</body>
</html>
